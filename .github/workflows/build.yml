name: Build APK

on:
  push:
    branches: [ master, main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip build-essential cmake ninja-build nasm yasm pkg-config meson gperf

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 23 and symlink as NDK 27
        run: |
          sdkmanager "ndk;23.2.8568313"
          ls -la $ANDROID_SDK_ROOT/ndk/
          rm -rf $ANDROID_SDK_ROOT/ndk/27.2.12479018
          ln -s $ANDROID_SDK_ROOT/ndk/23.2.8568313 $ANDROID_SDK_ROOT/ndk/27.2.12479018
          ls -la $ANDROID_SDK_ROOT/ndk/
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dropgram-debug
          path: TMessagesProj/build/outputs/apk/debug/*.apk
